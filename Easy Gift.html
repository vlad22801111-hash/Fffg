<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Easy Gift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone column, glass panels over a live wallpaper, tab bar pinned at the bottom */
:root{--bg:#131a26;--pan:rgba(30,39,56,.84);--pan2:rgba(44,56,79,.9);--line:#3a4760;--tx:#f4f7fc;--mut:#97a6bf;--acc:#2aa3f7;--acc2:#1769d6;--gold:#ffc933;--good:#4ade80;--bad:#fb7185;--fd:'Unbounded','Manrope',system-ui,sans-serif;--fb:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:dark}
body.aut{--acc:#f59e0b;--acc2:#c2410c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);font-size:15px;font-weight:500}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#wall{position:fixed;inset:0;z-index:0}
#wall canvas{position:absolute;inset:0;width:100%;height:100%}
#wall[data-wall=night]{background:radial-gradient(120% 80% at 50% 0,#22315a,#0d1220 70%)}
#wall[data-wall=neon]{background:linear-gradient(160deg,#14072f,#1f0c4d 45%,#04283f)}
#wall[data-wall=aurora]{background:linear-gradient(180deg,#06251f,#0a1a34 60%,#170c32)}
#wall[data-wall=autumn]{background:linear-gradient(180deg,#44200c,#2a150a 55%,#150b06)}
#wall[data-wall=sakura]{background:linear-gradient(180deg,#3d1733,#24132c 60%,#120a1d)}
#wall[data-wall=gold]{background:linear-gradient(180deg,#2e2409,#191308 70%,#0c0a05)}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding-inline:14px;padding-block:10px 120px}
.glass{background:var(--pan);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px}
h2{font:700 17px var(--fd);margin:18px 0 10px}
.mut{color:var(--mut)}.star{color:var(--gold);text-shadow:0 0 8px #ffb30055}
/* header */
#hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 10px}
.me{display:flex;align-items:center;gap:10px;min-width:0}
.me b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.me small{color:var(--mut)}
.av{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,hsl(var(--h) 70% 55%),hsl(var(--h) 60% 26%));border:2px solid #ffffff2a;font-size:24px;flex:none}
.av.big{width:76px;height:76px;font-size:42px}
.av.sm{width:36px;height:36px;font-size:19px}
.bal{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 14px;border-radius:30px;font:800 17px var(--fb)}
.plus{width:36px;height:36px;border-radius:50%;background:var(--acc);display:grid;place-items:center;font-size:24px;box-shadow:0 0 14px color-mix(in srgb,var(--acc) 60%,transparent)}
/* buttons and chips */
.btn{padding:12px 16px;border-radius:14px;background:linear-gradient(var(--acc),var(--acc2));font-weight:800;text-align:center;box-shadow:inset 0 1px 0 #fff4,0 4px 12px #0005}
.btn.alt{background:var(--pan2);box-shadow:inset 0 1px 0 #fff1}
.btn.gold{background:linear-gradient(#ffd24d,#d98a0b);color:#2a1a00}
.btn.red{background:linear-gradient(#fb7185,#be123c)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{padding:8px 12px;border-radius:11px;font-size:13px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:10px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:20px;background:var(--pan);border:1px solid var(--line);font-weight:700;font-size:14px}
.chip.on{background:var(--acc);border-color:transparent;color:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;background:#1b2332;border:1px solid #3a465c;font-weight:800;box-shadow:inset 0 2px 4px #0006}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;background:#1d4f7c;color:#7cc8ff}
.tag.aut{background:#6b3a0c;color:#ffc46b}
/* update banner */
.bnr{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:12px;border-color:color-mix(in srgb,var(--acc) 55%,#000)}
.bnr h3{font:700 14px var(--fd);margin-bottom:4px}.bnr p{color:var(--mut);font-size:13px}.bnr .btn{flex:none}
/* cases */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cc{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 8px;border-radius:18px;background:linear-gradient(var(--pan2),var(--pan));border:1px solid var(--line);text-align:center;position:relative;min-width:0}
.cc strong{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cc .tag{position:absolute;top:8px;right:8px}
.cc.big{border-color:#d4a017;box-shadow:0 0 22px #ffc93344}
.stage{height:110px;display:grid;place-items:center}
/* items */
.ia{position:relative;width:calc(var(--s,1)*88px);aspect-ratio:1;border-radius:calc(var(--s,1)*16px);overflow:hidden;font-size:calc(var(--s,1)*16px);flex:none}
.ia b{position:absolute;inset:0;display:grid;place-items:center;font-size:3em;font-weight:400}
.ia.nft{background:radial-gradient(circle at 50% 38%,var(--c1),var(--c2));box-shadow:inset 0 0 0 1px #fff3}
.ia.nft i{position:absolute;font-style:normal;color:#fff;opacity:.22;font-size:1.05em}
.ia.nft small{position:absolute;bottom:.3em;left:0;right:0;text-align:center;font-size:.68em;font-weight:800;color:#fff;text-shadow:0 1px 2px #000a}
.ia.gift{background:#18181a;box-shadow:inset 0 0 0 1px #ffffff14}
.ia.gift b{font-size:3.3em;filter:drop-shadow(0 .2em .25em #000a)}
.ia img{width:100%;height:100%;object-fit:cover;display:block}
.ia.slot{background:#ffffff0d;border:1px dashed #ffffff44;display:grid;place-items:center;color:var(--mut);font-size:calc(var(--s,1)*28px)}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:16px;background:var(--pan);border:1px solid var(--line);min-width:0}
.ic .ia{width:100%}
.ic span{font-size:12px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rar{font-weight:800;font-size:12px}
/* generic cards */
.card{padding:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stats div{padding:10px 12px;border-radius:14px;background:#ffffff0d}
.stats small{display:block;color:var(--mut);font-size:12px}.stats b{font-size:17px;font-weight:800}
.bar{height:8px;border-radius:5px;background:#0006;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--gold));border-radius:5px}
.lr{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:8px;border-radius:16px;min-width:0}
.lr .grow{flex:1;min-width:0}.lr .grow b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .grow small{color:var(--mut)}
.lr.me2{border-color:var(--acc);box-shadow:0 0 16px color-mix(in srgb,var(--acc) 35%,transparent)}
.rk{width:34px;text-align:center;font:700 15px var(--fd);color:var(--mut)}
.rk.t1{color:#ffd24d}.rk.t2{color:#d5dbe6}.rk.t3{color:#e0935a}
.empty{padding:22px 16px;text-align:center;color:var(--mut)}
input.in,select.in{width:100%;padding:12px 14px;border-radius:12px;background:#0d131d;border:1px solid var(--line)}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gear{width:40px;height:40px;border-radius:12px;background:var(--pan2);display:grid;place-items:center}
svg.ic24{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* nav */
#nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(500px,calc(100% - 20px));display:flex;padding:6px;border-radius:34px;background:rgba(20,27,40,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid #ffffff24;box-shadow:0 8px 24px #000a}
#nav button{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-radius:28px;color:#8f9db4;font-size:11px;font-weight:800}
#nav button.on{background:#ffffff1f;color:#fff;box-shadow:inset 0 1px 0 #fff3}
#nav button.on svg{color:var(--acc)}
#nav .dot{position:absolute;top:6px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:8px;background:var(--bad);font-size:10px;display:grid;place-items:center;color:#fff;padding:0 4px}
/* sheet */
[hidden]{display:none!important}
.sbg{position:fixed;inset:0;z-index:50;background:#000a;display:flex;align-items:flex-end;justify-content:center}
.sh{width:min(520px,100%);max-height:90%;overflow:auto;background:#182030;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh h3{font:700 18px var(--fd);margin-bottom:12px}
.sh .ctr{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;margin-bottom:12px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #ffffff12}
.kv:last-child{border:0}.kv span:first-child{color:var(--mut)}
.odds .kv b{font-weight:800}
.roll{position:relative;overflow:hidden;border-radius:16px;background:#0b111b;border:1px solid var(--line);margin:10px 0 14px;padding:10px 0}
.roll:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--gold);box-shadow:0 0 14px var(--gold);z-index:2}
.strip{display:flex;gap:8px;padding-left:8px;will-change:transform}
.strip .ia{width:104px}
.opt{display:flex;flex-wrap:wrap;gap:10px}
.opt button{width:46px;height:46px;border-radius:14px;background:var(--pan2);font-size:24px;border:2px solid transparent}
.opt button.on{border-color:var(--acc)}
.opt .sw{width:34px;height:34px;border-radius:50%;background:hsl(var(--h) 65% 45%)}
.walls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.walls button{height:64px;border-radius:14px;border:2px solid transparent;font-weight:800;font-size:12px;display:flex;align-items:flex-end;padding:6px;text-shadow:0 1px 3px #000}
.walls button.on{border-color:var(--acc)}
.tg{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #ffffff12}
.sw2{width:48px;height:28px;border-radius:14px;background:#0008;position:relative;transition:background .2s}
.sw2:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw2.on{background:var(--acc)}.sw2.on:after{transform:translateX(20px)}
#toast{position:fixed;z-index:90;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);padding:12px 18px;border-radius:14px;background:#0f1520;border:1px solid var(--line);font-weight:700;box-shadow:0 8px 24px #000a;text-align:center}
.prog{height:10px;border-radius:6px;background:#0007;overflow:hidden;margin:12px 0}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f59e0b,#fde047)}
ul.up{margin:6px 0 12px;padding-left:20px;display:grid;gap:6px}
/* gift shop tiles */
.gt{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 6px 14px;border-radius:18px;background:rgba(18,18,20,.88);border:1px solid #ffffff10}
.ge{font-size:60px;line-height:1;filter:drop-shadow(0 6px 8px #0008)}
.gp{padding:6px 14px;border-radius:20px;color:var(--gold);font-weight:800;background:#ffc9331f radial-gradient(circle,#ffc93399 1px,transparent 1.6px) 0 0/9px 9px}
.rb{position:absolute;top:12px;right:-32px;width:116px;transform:rotate(45deg);background:#22c55e;color:#fff;font-size:9px;font-weight:800;text-align:center;padding:3px 0}
.pop{animation:pop .35s ease-out both}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.wheelbox{position:relative;width:240px;height:240px;margin:14px auto}
.wheel{position:absolute;inset:0;border-radius:50%;border:4px solid #ffffff55;box-shadow:0 0 24px #0008,inset 0 0 20px #0006}
.wheel span{position:absolute;left:50%;top:50%;font-weight:800;font-size:15px;color:#fff;text-shadow:0 1px 3px #000}
.wp{position:absolute;left:50%;top:-12px;margin-left:-12px;border:12px solid transparent;border-top:22px solid var(--gold);z-index:2;filter:drop-shadow(0 2px 3px #000)}
.wh{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:#182030;border:3px solid var(--gold);z-index:1}
.ia.gift .gs{position:absolute;inset:9%;display:block}
.ia.gift .gs svg,.ge svg,.bigg svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 5px #0009)}
.ge{display:block;width:64px;height:64px;font-size:56px;line-height:64px;text-align:center}
.bigg{width:124px;height:124px}
#onl{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:0 2px 12px;color:var(--mut);font-size:13px}
#onl b{color:var(--tx);font-weight:800}
.liv{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good);flex:none}
.sep{width:1px;height:12px;background:var(--line)}
.sub{display:flex;padding:4px;margin-bottom:12px;border-radius:24px}
.sub button{flex:1;padding:10px 4px;border-radius:20px;font-weight:800;color:var(--mut)}
.sub button.on{color:var(--tx);background:#ffffff1c}
.hic{width:52px;height:52px;border-radius:50%;background:#1f3a2c;display:grid;place-items:center;font-size:26px;flex:none}
.hr{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #ffffff10}
.hr:last-child{border:0}
.hi{width:56px;height:56px;border-radius:14px;background:#2a3446;display:grid;place-items:center;flex:none;overflow:hidden}
.hi .ia{width:46px}
.hr .grow{flex:1;min-width:0}.hr .grow b{display:block;font-weight:800}
.hn{text-align:right;flex:none}.hn b{display:block;font-size:17px;font-weight:800}.hn small{color:var(--acc);font-weight:700}
.good{color:var(--good);font-weight:800}.bad{color:var(--bad);font-weight:800}
.pill.sm{padding:3px 10px;font-size:13px}
.myrank{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;margin-bottom:6px}
.myrank .big{font:700 24px var(--fd)}
.pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin:18px 0 14px}
.pc{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;position:relative;padding-top:4px}
.pc .pn{font-weight:800;font-size:13px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr{position:absolute;top:-20px;font-size:26px;filter:drop-shadow(0 2px 4px #000a)}
.pl{width:100%;display:grid;place-items:center;border-radius:14px 14px 0 0;font:700 26px var(--fd);color:#1b1304;margin-top:4px}
.pl.p1{height:84px;background:linear-gradient(#ffe27a,#d99a12)}
.pl.p2{height:62px;background:linear-gradient(#eef2f8,#9aa6ba)}
.pl.p3{height:46px;background:linear-gradient(#f0b27a,#a8672f)}
.md{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 14px 16px 20px;border-radius:20px;overflow:hidden;background:linear-gradient(120deg,var(--pan2),var(--pan))}
.md:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--mc)}
.md h3{font:700 22px var(--fd);margin-bottom:4px}
.md .msub{color:var(--mc);font-weight:800;margin-bottom:6px}
.md p{color:var(--mut);font-size:14px;margin-bottom:12px;max-width:210px}
.md .btn{display:inline-block;padding:10px 20px}
.mart{font-size:72px;line-height:1;filter:drop-shadow(0 8px 10px #000a);flex:none}
.liveb{display:flex;gap:8px;overflow-x:auto;align-items:center;margin-bottom:12px;scrollbar-width:none}
.liveb::-webkit-scrollbar{display:none}
.lv{writing-mode:vertical-rl;transform:rotate(180deg);color:var(--acc);font-weight:800;font-size:12px;flex:none}
.lvi{flex:none}.lvi .ia{width:50px;border-radius:12px}
@media (prefers-reduced-motion:reduce){.sh{animation:none}}

/* v5: кейсы */
.crate{position:relative;width:7em;height:7em;font-size:calc(var(--s,1)*16px);animation:flt 3.2s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-.25em)}}
.crate i,.crate em{position:absolute;display:block}
.cg{inset:-1.2em;background:radial-gradient(circle,hsl(var(--h) 95% 62%/.5),transparent 62%);animation:pls 2.4s ease-in-out infinite}
@keyframes pls{50%{opacity:.55;transform:scale(.92)}}
.cb{left:.7em;right:.7em;bottom:.2em;height:3.9em;border-radius:.45em .45em .9em .9em;background:linear-gradient(105deg,hsl(var(--h) 65% 30%),hsl(var(--h) 80% 50%) 38%,hsl(var(--h) 70% 36%) 70%,hsl(var(--h) 70% 22%));box-shadow:inset 0 .25em .3em #fff5,inset 0 -.9em 1em #0007,0 .6em .8em #0008;overflow:hidden}
.cb:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1em;margin-left:-.5em;background:linear-gradient(90deg,#d99a12,#fff3b0 50%,#d99a12)}
.cb:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#fff6 48%,transparent 60%) -150% 0/250% 100%;animation:shn 3.6s ease-in-out infinite}
@keyframes shn{to{background-position:150% 0}}
.cl{left:.35em;right:.35em;bottom:3.7em;height:1.5em;border-radius:.5em;background:linear-gradient(hsl(var(--h) 85% 66%),hsl(var(--h) 75% 42%));box-shadow:inset 0 .2em .25em #fff7,0 .3em .5em #0006;overflow:hidden}
.cl:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1.15em;margin-left:-.575em;background:linear-gradient(90deg,#d99a12,#fff3b0 50%,#d99a12)}
.cs{left:50%;bottom:5em;width:3em;height:1.4em;margin-left:-1.5em}
.cs:before,.cs:after{content:"";position:absolute;bottom:0;width:1.35em;height:1.1em;border:.28em solid #fcd34d;border-radius:70% 70% 20% 70%;box-shadow:0 .15em .2em #0006}
.cs:before{left:.05em;transform:rotate(-20deg)}
.cs:after{right:.05em;transform:scaleX(-1) rotate(-20deg)}
.crate em{left:50%;bottom:.55em;width:1.7em;height:1.7em;margin-left:-.85em;border-radius:50%;font-style:normal;font-size:1.4em;line-height:1.7em;text-align:center;background:radial-gradient(circle at 35% 30%,#fff,hsl(var(--h) 60% 86%));border:.08em solid #fde68a;box-shadow:0 .15em .4em #0008;z-index:2}
.crate.t2:after,.crate.t3:after,.crate.t4:after,.crate.t5:after{content:"✦";position:absolute;right:-.1em;top:.5em;color:#fff;font-size:1.1em;text-shadow:0 0 .5em #fff;animation:tw 1.8s infinite}
.crate.t4:before,.crate.t5:before{content:"✦";position:absolute;left:-.1em;top:1.6em;color:#ffe27a;font-size:1em;text-shadow:0 0 .5em #ffd24a;animation:tw 1.5s .5s infinite}
.crate.t5 .cg{background:radial-gradient(circle,#ffd24acc,transparent 62%)}
@keyframes tw{50%{opacity:.2;transform:scale(.6)}}
.cc{background:radial-gradient(120% 70% at 50% 0,hsl(var(--h,200) 65% 32%/.6),transparent 70%),linear-gradient(var(--pan2),var(--pan));overflow:hidden}
.cc:active{transform:scale(.97)}
.cc.big{border-color:#d4a017;box-shadow:0 0 22px #ffc93344}
.tag.win{background:#0b4a6f;color:#9ae1ff}
@media (prefers-reduced-motion:reduce){.crate,.cg,.cb:after,.crate:after,.crate:before{animation:none}}
/* v5: ауры, профиль, настройки, админка */
.av.xl{width:96px;height:96px;font-size:54px}
.av.au{position:relative;box-shadow:0 0 18px color-mix(in srgb,var(--ac) 70%,transparent)}
.av.au:before,.rp:before{content:"";position:absolute;inset:-6px;border-radius:50%;background:var(--g);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));animation:ringspin 4s linear infinite}
.av.sm.au:before{inset:-4px}
@keyframes ringspin{to{transform:rotate(360deg)}}
.pbn{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 16px 18px;border-radius:24px;border:1px solid var(--line);overflow:hidden;background:radial-gradient(120% 90% at 10% 0,hsl(var(--h) 75% 42%/.75),transparent 60%),radial-gradient(90% 80% at 100% 100%,hsl(calc(var(--h) + 70) 75% 40%/.6),transparent 60%),var(--pan)}
.pbn .gear{position:absolute;right:12px;top:12px;background:#0006}
.pav{margin:6px 0 10px}
.pnm{font:700 20px var(--fd);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptl{color:#fff;font-weight:700;font-size:13px;padding:3px 12px;border-radius:12px;background:#0006}
.pbn .bar{width:100%;margin-top:10px}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stg .glass{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.stg small{color:var(--mut)}.stg b{font:700 15px var(--fd)}
.aus{display:flex;gap:10px;overflow-x:auto;padding:8px 6px 10px;scrollbar-width:none}
.aus::-webkit-scrollbar{display:none}
.au1{flex:none;width:92px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:16px;background:var(--pan);border:2px solid transparent;text-align:center}
.au1.on{border-color:var(--acc)}.au1.lk{opacity:.5}
.au1 span{font-weight:800;font-size:12px}.au1 small{color:var(--mut);font-size:11px}
.rp{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#667,#223);position:relative;display:block;margin:4px}
.rp:before{inset:-4px}
.sc{font:700 12px var(--fd);color:var(--mut);margin:20px 2px 8px;text-transform:uppercase;letter-spacing:.06em}
.cardp{padding:14px;border-radius:18px}
.vb{font-weight:800;color:var(--mut);padding:4px 0}
.adm .row2{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.adm .row3{display:flex;gap:8px;margin:8px 0}
.adm .in{min-width:0}
body.win{--acc:#38bdf8;--acc2:#0369a1}
#wall[data-wall=winter]{background:linear-gradient(180deg,#0b2545,#13315c 55%,#0a1628)}

function makeItem(v,kind,aut){
  var w=aut==='w',mo,bd;
  if(w&&Math.random()<.7){mo=pick(WM);bd=pick(WB)}
  else if(aut&&!w&&Math.random()<.7){mo=pick(AM);bd=pick(AB)}
  else{mo=pick(kind==='nft'?NM:GM);bd=pick(NB)}
  return {id:uid(),kind:kind,name:mo[0],emoji:mo[1],value:v,num:1000+Math.floor(Math.random()*89000),bd:bd,sym:pick(SY)};
}
function drawItem(c){
  var r=Math.random(),a=0,m=TIER[TIER.length-1][0];
  for(var i=0;i<TIER.length;i++){a+=TIER[i][1];if(r<=a){m=TIER[i][0];break}}
  var v=Math.max(1,Math.round((c.price||1)*m*(.9+Math.random()*.2)));
  var nft=m>=10||(m>=1.2&&Math.random()<.45)||(m>=.8&&Math.random()<.2);
  return makeItem(v,nft?'nft':'gift',c.win?'w':c.aut);
}

  if(!S.sound)return;

  }catch(e){}
}

var cv=$('#cv'),cx=cv.getContext('2d'),W=0,H=0,parts=[],raf=0;
function wsize(){var d=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0)}
function newPart(m,init){
  var r=Math.random;
  if(m==='night')return {x:r()*W,y:r()*H,r:r()*1.6+.3,p:r()*6.28,s:r()*.003+.001};
  if(m==='autumn'||m==='sakura'||m==='winter')return {x:r()*W,y:init?r()*H:-30,vy:(m==='winter'?.4:.5)+r()*1.1,vx:(r()-.5)*.6,rot:r()*6.28,vr:(r()-.5)*.04,sz:(m==='winter'?9:14)+r()*14,ch:m==='sakura'?'🌸':m==='winter'?pick(['❄','❅','❆']):pick(['🍁','🍂','🍁','🍃']),ph:r()*6.28};
  if(m==='gold')return {x:r()*W,y:init?r()*H:H+10,vy:-(.2+r()*.5),r:r()*2+.6,p:r()*6.28,s:r()*.004+.001};
  return {x:r()*W,y:r()*H,vx:(r()-.5)*.5,vy:(r()-.5)*.5,r:140+r()*160,h:m==='neon'?pick([300,190,260]):pick([150,200,270])};
}
function drawWall(t){
  cx.clearRect(0,0,W,H);var m=S.wall;
  parts.forEach(function(p,i){
    if(m==='night'){cx.fillStyle='rgba(255,255,255,'+(.35+.6*Math.abs(Math.sin(t*p.s+p.p)))+')';cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.3);cx.fill()}
    else if(m==='autumn'||m==='sakura'||m==='winter'){
      if(t){p.y+=p.vy;p.x+=p.vx+Math.sin(t/800+p.ph)*.5;p.rot+=p.vr;if(p.y>H+30)parts[i]=newPart(m,false)}
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.font=p.sz+'px sans-serif';cx.globalAlpha=m==='winter'?.9:.85;if(m==='winter')cx.fillStyle='#eaf6ff';cx.fillText(p.ch,-p.sz/2,p.sz/2);cx.restore();
    }else if(m==='gold'){
      if(t){p.y+=p.vy;if(p.y<-10)parts[i]=newPart(m,false)}
      cx.fillStyle='rgba(255,210,90,'+(.25+.6*Math.abs(Math.sin(t*p.s+p.p)))+')';cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.3);cx.fill();
    }else{
      if(t){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1}
      var g=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g.addColorStop(0,'hsla('+p.h+',90%,55%,.26)');g.addColorStop(1,'hsla('+p.h+',90%,55%,0)');cx.fillStyle=g;cx.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2);
    }
  });
}
function loop(t){drawWall(t||0);if(S.anim&&!REDUCED)raf=requestAnimationFrame(loop)}

  $('#wall').dataset.wall=S.wall;document.body.classList.toggle('aut',!!S.autumn);document.body.classList.toggle('win',!!S.winter);wsize();

function friendPick(src){
  if(!UID)return toast('Отправка подарков работает онлайн');

function giftSend(v){
  var k=v.indexOf('|'),fid=v.slice(0,k),src=v.slice(k+1),it,sh=null;
  if(!DB||relWith(fid)!=='friend')return;
  if(src.indexOf('gs:')===0){var code=src.slice(3),rs=code.charAt(0)==='r';sh=(rs?RS:SH)[Number(code.slice(1))];if(!sh)return;if(S.bal<sh[2])return toast('Не хватает ★ '+fmt(sh[2]-S.bal));it=mkShopItem(sh,rs)}
  else{it=S.inv.find(function(x){return x.id===src.slice(4)});if(!it)return}
  DB.collection('inbox').add({to:fid,from:UID,fname:S.name,item:slim(it),at:Date.now()}).then(function(){
    if(sh)S.bal-=sh[2];else{S.inv=S.inv.filter(function(x){return x.id!==it.id});S.show=S.show.filter(function(x){return x!==it.id})}
    S.xp+=10;save();tone([523,784]);toast('Подарок отправлен');V.lock=false;closeSheet();render();
  }).catch(function(){toast('Не удалось отправить подарок')});
}

function sellItem(id){
  var i=S.inv.findIndex(function(x){return x.id===id});if(i<0)return;
  var it=S.inv[i];S.inv.splice(i,1);S.show=S.show.filter(function(x){return x!==id});earn(sellOf(it));logAdd('sale',sellOf(it),it);S.cnt.sell++;save();tone([880,660]);toast('Продано за ★ '+fmt(sellOf(it)));V.lock=false;closeSheet();render();
}
function resize(file,cb){
  var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement('canvas');c.width=c.height=96;var x=c.getContext('2d'),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,96,96);cb(c.toDataURL('image/jpeg',.7))};im.onerror=function(){cb(null)};im.src=fr.result};fr.onerror=function(){cb(null)};fr.readAsDataURL(file);
}

  var q=[1e3,1e4,1e5,1e6,1e7,1e8].map(function(v){return '<button class="chip" data-a="admadd" data-v="'+v+'">+'+fmt(v)+'</button>'}).join('');
  var xp=[100,1000,10000].map(function(v){return '<button class="chip" data-a="admxp" data-v="'+v+'">+'+fmt(v)+' XP</button>'}).join('');
  var au=AURAS.filter(function(a){return a.id!=='none'}).map(function(a){var own=(S.auras||[]).indexOf(a.id)>=0;return '<button class="au1 '+(own?'on':'')+'" data-a="admaura" data-v="'+a.id+'"><i class="rp" style="--g:'+a.g+'"></i><span>'+a.n+'</span><small>'+(own?'Выдана · снять':'Выдать')+'</small></button>'}).join('');
  sheet('<div class="adm"><h3>Админка</h3><div class="mut">Баланс: '+ST(S.bal)+' · ур. '+lv(S.xp)+' · предметов '+S.inv.length+'</div>'
   +'<div class="sc">Звёзды</div><div class="row2">'+q+'</div><div class="row3"><input class="in" id="am" type="number" inputmode="numeric" placeholder="Своё количество"><button class="btn sm" data-a="admadd" data-v="in">Выдать</button><button class="btn sm alt" data-a="admset">Задать</button></div>'
   +'<div class="sc">Опыт</div><div class="row2">'+xp+'</div>'
   +'<div class="sc">Предмет</div><select class="in" id="ai_m">'+ADMI.map(function(x,i){return '<option value="'+i+'">'+(x[0]==='nft'?'NFT · ':'')+esc(x[1])+' '+x[2]+'</option>'}).join('')+'</select><div class="row3"><input class="in" id="ai_v" type="number" inputmode="numeric" value="1000" placeholder="Цена ★"><input class="in" id="ai_n" type="number" inputmode="numeric" value="1" placeholder="Сколько"></div><button class="btn gold" style="width:100%" data-a="admitem">Выдать предмет</button>'
   +'<div class="sc">Ауры</div><div class="aus">'+au+'</div>'
   +'<div class="sc">Обновления и прочее</div><div class="row2"><button class="chip" data-a="admupd" data-v="a">Осень вкл</button><button class="chip" data-a="admupd" data-v="w">Зима вкл</button><button class="chip" data-a="admupd" data-v="off">Обновления выкл</button><button class="chip" data-a="admcd">Сбросить таймеры</button></div>'
   +'<button class="btn alt" style="width:100%;margin-top:6px" data-a="admout">Выйти из админки</button></div>');
}

function winSheet(){
  if(S.winter)return;
  sheet('<div class="ctr"><div style="font-size:54px">❄️</div><h3 style="margin:0">Зимнее обновление 2.0</h3></div><ul class="up"><li>40 новых кейсов, всего '+(CB.length+CA.length+CW.length)+'</li><li>Кейс «Ледяной трон» за ★ 2 000 000</li><li>Обои «Зима» со снегопадом</li><li>3 новые зимние ауры</li><li>Зимние подарки и NFT в дропе</li></ul><div class="prog"><i id="pgiw"></i></div><div class="row"><button class="btn alt" data-a="laterw">Позже</button><button class="btn gold" id="ibw" data-a="installw">Установить</button></div>');
}
function installW(){
  var b=$('#ibw');if(!b)return;b.disabled=true;b.textContent='Установка…';V.lock=true;
  var p=0,iv=setInterval(function(){p+=4;var e=$('#pgiw');if(e)e.style.width=Math.min(p,100)+'%';if(p>=100){clearInterval(iv);
    S.winter=true;S.wall='winter';S.auras=S.auras||[];if(S.auras.indexOf('frost')<0)S.auras.push('frost');V.lock=false;V.filter='win';V.winReady=false;save();wallApply();closeSheet();V.tab='cases';V.home='cases';render();toast('Зимнее обновление установлено, получена аура «Иней»');tone([523,659,784,1047]);}},90);
}
(function waitW(){
  var left=9e5-(Date.now()-T0);
  setTimeout(function(){
    if(S.winter)return;
    if(V.lock||!$('#sbg').hidden){V.winReady=true;if(V.tab==='cases')render();return setTimeout(waitW,3000)}
    V.winReady=true;if(V.tab==='cases')render();winSheet();
  },Math.max(0,left));
})();
(function wait(){
  var left=20000-(Date.now()-T0);
  setTimeout(function(){
    if(S.autumn)return;
    if(V.lock||!$('#sbg').hidden){V.upReady=true;if(V.tab==='cases')render();return setTimeout(wait,3000)}
    V.upReady=true;if(V.tab==='cases')render();updSheet();
  },Math.max(0,left));
})();
})();
</script>
